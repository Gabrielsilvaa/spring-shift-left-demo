server:
  port: 8081

spring:
  application:
    name: spring-shift-left-demo
  datasource:
    url: jdbc:h2:mem:demodb
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none # Desativado pois usaremos schema.sql
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html