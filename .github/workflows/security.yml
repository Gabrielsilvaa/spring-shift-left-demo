name: Shift Left AI Security

on:
  pull_request:
    branches: [ "main" ]

jobs:
  sast-ai-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Permissão obrigatória para a IA comentar no PR
      contents: read

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🛠️ Instalar Semgrep e dependências
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          sudo apt-get install jq -y

      - name: 🧠 Instalar e Iniciar Ollama (Motor de IA)
        run: |
          # Baixa e instala o Ollama no runner do GitHub
          curl -fsSL https://ollama.com/install.sh | sh
          
          # Inicia o servidor em background
          ollama serve &
          
          # Aguarda o servidor subir e faz o pull do modelo
          sleep 5
          echo "Baixando o modelo gemma2 (Isso pode levar alguns minutos)..."
          ollama pull gemma2

      - name: 🕵️ Executar Scan Inteligente
        run: |
          # Executa o script que criamos para gerar o INSTRUCOES_IDE.md
          chmod +x scan-inteligente.sh
          ./scan-inteligente.sh

      - name: 💬 Comentar Relatório da IA no Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Lê o arquivo Markdown gerado pela IA
            const report = fs.readFileSync('INSTRUCOES_IDE.md', 'utf8');
            
            // Adiciona uma saudação personalizada do bot
            const finalComment = `🤖 **Shift Left AI Agent** analisou este PR:\n\n${report}`;
            
            // Posta o comentário no PR do GitHub
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: finalComment
            });