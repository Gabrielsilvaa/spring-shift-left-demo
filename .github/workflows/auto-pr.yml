name: Auto-PR & Shift Left AI Security

on:
  push:
    branches-ignore:
      - master

jobs:
  sast-ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🚀 Criar Pull Request Automático
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base master \
            --head ${{ github.ref_name }} \
            --title "🚀 Automacao: Modificacoes na branch ${{ github.ref_name }}" \
            --body "A esteira do **Shift Left AI** esta analisando este codigo..." || true
          
          PR_NUMBER=$(gh pr view ${{ github.ref_name }} --json number --jq '.number')
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV

      - name: 🛠️ Instalar Semgrep e dependencias
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          sudo apt-get install jq -y

      - name: 🧠 Instalar e Iniciar Ollama (Modo Otimizado)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          export OLLAMA_NUM_PARALLEL=1
          export OLLAMA_MAX_LOADED_MODELS=1
          ollama serve > ollama.log 2>&1 &
          sleep 10
          echo "Baixando o modelo tinyllama..."
          ollama pull tinyllama

      - name: 🕵️ Executar Scan SAST e IA (Independente)
        run: |
          echo "--- PASSO 1: Rodando Semgrep ---"
          semgrep scan --config semgrep.yml --json > semgrep-raw.json || true
          cat semgrep-raw.json | jq -r '.results[] | "File: \(.path) | Line: \(.start.line) | Issue: \(.extra.message)"' > falhas.txt
          
          echo "--- LOG DE FALHAS DETECTADAS ---"
          cat falhas.txt
          
          if [ ! -s falhas.txt ]; then
            echo "Nenhuma falha encontrada."
            echo "# 🎉 Shift Left: Analise Concluida" > INSTRUCOES_IDE.md
            echo "O SAST analisou o codigo e **nao possui vulnerabilidade**." >> INSTRUCOES_IDE.md
          else
            echo "--- PASSO 2: IA Gerando Remediacao ---"
            cat falhas.txt | ollama run tinyllama "Voce e um Arquiteto de Seguranca Senior. Escreva uma 'Ordem de Servico' tecnica em Markdown para um Agente de IA na IDE.
            REGRAS ABSOLUTAS:
            1. ZERO acentos graficos.
            2. NENHUM codigo ANSI. 
            3. Seja tecnico e mandatorio.
            ESTRUTURA:
            # ORDEM DE SERVICO: REMEDIACAO SAST
            ## Arquivo: [Nome]
            - **Linha:** [Linha]
            - **Problema:** [Descricao]
            - **Instrucao:** [Correcao]" > raw_llm_output.txt
          
            cat raw_llm_output.txt | sed $'s/\033\\[[0-9;]*[a-zA-Z]//g' > INSTRUCOES_IDE.md
          
            echo "--- LOG DO RELATORIO GERADO PELA IA ---"
            cat INSTRUCOES_IDE.md
          fi

      - name: 🔒 Validar Seguranca (Bloquear Merge)
        run: |
          if [ -s falhas.txt ]; then
            echo "::error::Vulnerabilidades detectadas! Bloqueando o merge."
            exit 1
          fi

      - name: 💬 Comentar Relatorio da IA no Pull Request
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            if (!prNumber || !fs.existsSync('INSTRUCOES_IDE.md')) return;
            
            const report = fs.readFileSync('INSTRUCOES_IDE.md', 'utf8');
            
            // Log para aparecer na tela do GitHub Actions durante a demo
            console.log("--- CONTEUDO DO RELATORIO QUE SERA POSTADO ---");
            console.log(report);
            console.log("----------------------------------------------");
            
            const finalComment = `🤖 **Shift Left AI Agent** analisou este PR:\n\n${report}`;
            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: finalComment
            });