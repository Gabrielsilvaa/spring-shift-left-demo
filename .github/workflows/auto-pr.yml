name: Auto-PR & Shift Left AI Security

on:
  push:
    branches-ignore:
      - master

jobs:
  sast-ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🚀 Criar Pull Request Automático
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base master \
            --head ${{ github.ref_name }} \
            --title "🚀 Automacao: Modificacoes na branch ${{ github.ref_name }}" \
            --body "A esteira do **Shift Left AI** esta analisando este codigo..." || true
          
          PR_NUMBER=$(gh pr view ${{ github.ref_name }} --json number --jq '.number' 2>/dev/null || echo "")
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list --head ${{ github.ref_name }} --base master --json number --jq '.[0].number' 2>/dev/null || echo "")
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "DEBUG: PR_NUMBER = $PR_NUMBER"

      - name: 🛠️ Instalar Semgrep e dependencias
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          sudo apt-get install jq -y

      - name: 🧠 Instalar e Iniciar Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          export OLLAMA_NUM_PARALLEL=1
          export OLLAMA_MAX_LOADED_MODELS=1
          ollama serve > ollama.log 2>&1 &
          sleep 15
          echo "Baixando modelo..."
          ollama pull gemma2:2b

      - name: 🕵️ Executar Scan SAST
        run: |
          echo "--- PASSO 1: Rodando Semgrep ---"
          semgrep scan --config semgrep.yml --json > semgrep-raw.json || true
          cat semgrep-raw.json | jq -r '.results[] | "File: \(.path) | Line: \(.start.line) | Issue: \(.extra.message)"' > falhas.txt || echo "" > falhas.txt
          
          echo "--- LOG DE FALHAS DETECTADAS ---"
          cat falhas.txt

      - name: 🤖 Gerar Remediacoes com IA
        run: |
          if [ -s falhas.txt ]; then
            echo "--- PASSO 2: IA Gerando Remediacao ---"
            cat falhas.txt | ollama run gemma2:2b "Voce e um Arquiteto de Seguranca Senior. Analise este relatorio SAST e crie uma Ordem de Servico em Markdown para corrigir.
            
            REGRAS:
            1. SEM acentos (nao use til, cedilha, acento agudo)
            2. SEM codigos ANSI
            3. Seja tecnico e objetivo
            
            FORMATO:
            # ORDEM DE SERVICO: REMEDIACAO SAST
            
            ## Arquivo: [nome]
            - Linha: [linha]
            - Problema: [descricao]
            - Instrucao: [correcao com codigo/exemplo]
            
            Log SAST:" > INSTRUCOES_IDE.md
          else
            echo "# Sucesso! Nenhuma vulnerabilidade encontrada" > INSTRUCOES_IDE.md
          fi

      - name: 💬 Comentar no Pull Request
        if: always()
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            
            console.log("DEBUG: PR_NUMBER =", process.env.PR_NUMBER);
            console.log("DEBUG: Arquivo existe?", fs.existsSync('INSTRUCOES_IDE.md'));
            
            if (!prNumber || isNaN(prNumber)) {
              console.log("❌ PR_NUMBER invalido");
              return;
            }
            
            if (!fs.existsSync('INSTRUCOES_IDE.md')) {
              console.log("❌ Arquivo nao encontrado");
              return;
            }
            
            const report = fs.readFileSync('INSTRUCOES_IDE.md', 'utf8');
            console.log("--- CONTEUDO PARA POSTAR ---");
            console.log(report);
            
            const comment = `🤖 Shift Left AI Security Agent\n\n${report}`;
            
            try {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
              console.log("✅ Comentario postado com sucesso!");
            } catch (error) {
              console.log("❌ Erro ao postar:", error.message);
            }

      - name: 🔒 Bloquear Merge se houver Vulnerabilidades
        if: always()
        run: |
          if [ -s falhas.txt ]; then
            echo "::error::Vulnerabilidades detectadas! Merge bloqueado."
            exit 1
          fi
