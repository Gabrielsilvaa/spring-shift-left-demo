name: Auto Create Pull Request

on:
  push:
    branches-ignore:
      - main # Roda em qualquer branch que você der push, exceto na main

jobs:
  sast-ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessário para ler o código
      pull-requests: write # Necessário para criar o PR e fazer o comentário

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🚀 Criar Pull Request Automático
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Usamos o token nativo e seguro do GitHub
        run: |
          # Cria o PR (se der erro porque já existe, ele ignora e segue em frente)
          gh pr create \
            --base main \
            --head ${{ github.ref_name }} \
            --title "🚀 Automação: Modificações na branch ${{ github.ref_name }}" \
            --body "A esteira do **Shift Left AI** está analisando este código..." || true
          
          # Descobre o número do PR desta branch e salva em uma variável de ambiente
          PR_NUMBER=$(gh pr view ${{ github.ref_name }} --json number -jq '.number')
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV

      - name: 🛠️ Instalar Semgrep e dependências
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          sudo apt-get install jq -y

      - name: 🧠 Instalar e Iniciar Ollama (Motor de IA)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          echo "Baixando o modelo gemma2 (Isso pode levar alguns minutos)..."
          ollama pull gemma2

      - name: 🕵️ Executar Scan Inteligente
        run: |
          chmod +x scan-inteligente.sh
          ./scan-inteligente.sh

      - name: 💬 Comentar Relatório da IA no Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Pega o número do PR que foi descoberto no passo anterior
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            
            // Lê o arquivo Markdown gerado pela IA
            const report = fs.readFileSync('INSTRUCOES_IDE.md', 'utf8');
            
            const finalComment = `🤖 **Shift Left AI Agent** analisou este PR:\n\n${report}`;
            
            // Posta o comentário usando o número exato do PR
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: finalComment
            });